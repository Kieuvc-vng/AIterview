<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interview | AIterview</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app" class="app-container">
    <!-- Interview page will be rendered here -->
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/setupPage.js"></script>
  <script src="/js/interviewPage.js"></script>
  <script src="/js/reviewPage.js"></script>
  <script src="/js/jobLibraryPage.js"></script>
  <script src="/js/jobDetailPage.js"></script>
  <script>
    // Parse URL parameters for candidate interview
    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      const jobId = params.get('job_id') || params.get('job');
      const candidateId = params.get('candidate');

      if (jobId && candidateId) {
        try {
          // Create a real interview session on the backend
          const response = await fetch('/api/interview/create-from-candidate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ jobId, candidateId })
          });

          if (!response.ok) {
            throw new Error(`Failed to create interview session: ${response.status}`);
          }

          const { sessionId } = await response.json();

          // Store session info in localStorage for reference
          localStorage.setItem('current_job_id', jobId);
          localStorage.setItem('current_candidate_id', candidateId);
          localStorage.setItem('current_interview_session', sessionId);

          // Initialize interview page with real session ID
          App.goToPage('interview', { sessionId });
        } catch (error) {
          App.appElement.innerHTML = `<div class="message message-error"><span>⚠️</span> Failed to start interview: ${error.message}</div>`;
        }
      } else {
        // Missing parameters
        App.appElement.innerHTML = '<div class="message message-error"><span>⚠️</span> Invalid interview link. Missing job or candidate information.</div>';
      }
    });
  </script>
</body>
</html>
