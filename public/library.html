<!DOCTYPE html>
<html>
<head>
  <title>Job Library | AIterview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; }
    header { background: white; padding: 1rem 2rem; border-bottom: 1px solid #eee; }
    .container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
    .job-card { background: white; padding: 1.5rem; margin: 1rem 0; border-radius: 8px; border: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
    .job-info h3 { margin-bottom: 0.5rem; }
    .job-info p { color: #666; font-size: 14px; }
    .actions { display: flex; gap: 0.5rem; }
    button { padding: 0.5rem 1rem; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
    .btn-primary { background: #2196f3; color: white; }
    .btn-secondary { background: #f5f5f5; color: #333; border: 1px solid #ddd; }
    .btn-create { background: #4caf50; color: white; padding: 0.7rem 1.5rem; font-size: 16px; margin-top: 2rem; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal.active { display: flex; }
    .modal-content { background: white; padding: 2rem; border-radius: 8px; max-width: 400px; width: 90%; }
    .modal-content h2 { margin-bottom: 1rem; }
    .modal-content input { width: 100%; padding: 0.7rem; margin-bottom: 1rem; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
    .modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; }
    .link-section { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
    .link-info { color: #4caf50; font-weight: 500; margin: 0; }
    .link-display { display: flex; gap: 10px; }
    .link-input { flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 12px; }
    .btn-small { padding: 6px 12px; font-size: 12px; }
    .send-email-btn { background: #ff9800; color: white; margin-top: 5px; }

    /* ===== Phase 3: Candidate card, badges, accordion, chat modal ===== */

    /* Candidate card */
    .candidate-card {
      background: white;
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 0.75rem;
    }
    .candidate-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }
    .candidate-name {
      font-weight: 600;
      font-size: 15px;
    }
    .badge {
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-completed {
      background: #e8f5e9;
      color: #2e7d32;
    }
    .badge-pending {
      background: #fff3e0;
      color: #e65100;
    }
    .candidate-meta {
      color: #888;
      font-size: 12px;
      margin-bottom: 0.5rem;
    }
    .candidate-actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.5rem;
    }
    .btn-copy { background: #e3f2fd; color: #1565c0; border: 1px solid #bbdefb; }
    .btn-remind { background: #fff3e0; color: #e65100; border: 1px solid #ffe0b2; }
    .btn-remind:disabled { background: #f5f5f5; color: #999; border-color: #ddd; cursor: default; }
    .btn-export { background: #f3e5f5; color: #7b1fa2; border: 1px solid #e1bee7; }
    .btn-expand { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }

    /* Accordion */
    .summary-accordion {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }
    .summary-accordion.open {
      max-height: 2000px;
    }
    .summary-section {
      padding: 0.75rem 0;
      border-top: 1px solid #f0f0f0;
    }
    .skill-group-title {
      font-weight: 600;
      font-size: 13px;
      color: #1565c0;
      margin: 0.75rem 0 0.25rem;
    }
    .question-item {
      margin-bottom: 0.5rem;
      padding-left: 0.5rem;
    }
    .question-text {
      font-size: 12px;
      font-weight: 500;
      color: #333;
    }
    .answer-summary {
      font-size: 12px;
      color: #555;
      margin-top: 2px;
    }
    .followup-summary {
      font-size: 11px;
      color: #888;
      font-style: italic;
      margin-top: 2px;
    }
    .summary-loading {
      text-align: center;
      padding: 1rem;
      color: #999;
      font-size: 13px;
    }
    .summary-empty {
      text-align: center;
      padding: 1rem;
      color: #999;
      font-size: 13px;
    }

    /* Export dropdown */
    .export-dropdown {
      position: relative;
      display: inline-block;
    }
    .export-menu {
      display: none;
      position: absolute;
      bottom: 100%;
      left: 0;
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      z-index: 1100;
      min-width: 140px;
      margin-bottom: 4px;
    }
    .export-menu.show { display: block; }
    .export-menu-item {
      padding: 8px 14px;
      font-size: 12px;
      cursor: pointer;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }
    .export-menu-item:hover { background: #f5f5f5; }

    /* Full chat modal (modal-in-modal) */
    .chat-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      z-index: 1200;
      justify-content: center;
      align-items: center;
    }
    .chat-modal.active { display: flex; }
    .chat-modal-content {
      background: white;
      border-radius: 10px;
      max-width: 650px;
      width: 95%;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
    }
    .chat-modal-header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .chat-modal-header h3 { margin: 0; font-size: 16px; }
    .chat-modal-body {
      padding: 1rem 1.5rem;
      overflow-y: auto;
      flex: 1;
    }
    .chat-bubble {
      max-width: 80%;
      padding: 0.6rem 1rem;
      border-radius: 12px;
      margin-bottom: 0.5rem;
      font-size: 13px;
      line-height: 1.5;
    }
    .chat-ai {
      background: #f0f0f0;
      color: #333;
      align-self: flex-start;
      margin-right: auto;
    }
    .chat-candidate {
      background: #e3f2fd;
      color: #0d47a1;
      align-self: flex-end;
      margin-left: auto;
    }
    .chat-messages-container {
      display: flex;
      flex-direction: column;
    }
    .btn-close-chat {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: #666;
      padding: 4px 8px;
    }
  </style>
</head>
<body>
  <header>
    <h1>📚 Thư Viện Job</h1>
  </header>

  <div class="container">
    <div id="jobsList"></div>
    <button class="btn-create" onclick="showCreateJobForm()">+ Tạo Job Mới</button>
  </div>

  <div id="editJobModal" class="modal">
    <div class="modal-content" style="max-width: 600px;">
      <h2>Chi Tiết Job</h2>
      <div id="editJobContent" style="max-height: 500px; overflow-y: auto;">
        <!-- Job details will be populated here -->
      </div>
      <div class="modal-actions" style="margin-top: 1rem;">
        <button class="btn-secondary" onclick="closeEditJobModal()">Đóng</button>
        <button class="btn-primary" id="editJobBtn" onclick="editJobSetup()">Chỉnh Sửa</button>
      </div>
    </div>
  </div>

  <div id="candidatesModal" class="modal">
    <div class="modal-content" style="max-width: 600px; max-height: 600px; overflow-y: auto;">
      <h2>Danh Sách Ứng Viên</h2>
      <div id="candidatesList" style="margin: 1rem 0;"></div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeCandidatesModal()">Đóng</button>
      </div>
    </div>
  </div>

  <div id="sendModal" class="modal">
    <div class="modal-content">
      <h2>Gửi cho Ứng Viên</h2>
      <div id="formSection">
        <input type="text" id="candidateName" placeholder="Tên ứng viên" />
        <input type="email" id="candidateEmail" placeholder="Email" />
        <input type="tel" id="candidatePhone" placeholder="Số điện thoại" />
        <div class="modal-actions">
          <button class="btn-secondary" onclick="closeSendModal()">Hủy</button>
          <button class="btn-primary" onclick="generateLink()">Tạo Link</button>
        </div>
      </div>
      <div id="linkSection" class="link-section" style="display: none;">
        <p class="link-info">✓ Link tạo thành công</p>
        <div class="link-display">
          <input type="text" id="generatedLink" class="link-input" readonly />
          <button class="btn btn-primary btn-small copy-link-btn">Copy</button>
        </div>
        <button class="btn btn-secondary" onclick="closeSendModal()" style="margin-top: 5px;">Đóng</button>
      </div>
    </div>
  </div>

  <!-- Full Chat Modal -->
  <div id="chatModal" class="chat-modal">
    <div class="chat-modal-content">
      <div class="chat-modal-header">
        <h3 id="chatModalTitle">Toàn Bộ Câu Trả Lời</h3>
        <button class="btn-close-chat" onclick="closeChatModal()">&times;</button>
      </div>
      <div class="chat-modal-body">
        <div id="chatMessagesContainer" class="chat-messages-container"></div>
      </div>
    </div>
  </div>

  <script>
    let currentJobId = null;
    let currentCandidateData = null;

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    // Load jobs on page load
    document.addEventListener('DOMContentLoaded', loadJobs);

    function loadJobs() {
      // Get hr_email from localStorage
      const hrEmail = localStorage.getItem('hr_email') || 'default@company.com';

      fetch(`/api/job-library/jobs?hr_email=${encodeURIComponent(hrEmail)}`)
        .then(r => r.json())
        .then(jobs => {
          const list = document.getElementById('jobsList');
          if (jobs.length === 0) {
            list.innerHTML = '<p style="text-align: center; color: #666;">Chưa có job nào. Tạo job mới!</p>';
            return;
          }
          list.innerHTML = jobs.map(job => `
            <div class="job-card">
              <div class="job-info">
                <h3>${job.job_title} (${job.level})</h3>
                <p>${job.company} · ${JSON.parse(job.skills || '[]').length} skills</p>
              </div>
              <div class="actions">
                <button class="btn-primary" onclick="showCandidatesModal('${job.id}', '${escapeHtml(job.job_title || '')}')">Xem Ứng Viên</button>
                <button class="btn-secondary" onclick="openSendModal('${job.id}')">Tạo Ứng Viên</button>
                <button class="btn-secondary" onclick="openJobDetail('${job.id}')">Chỉnh Sửa</button>
              </div>
            </div>
          `).join('');
        });
    }

    function openSendModal(jobId) {
      currentJobId = jobId;
      document.getElementById('sendModal').classList.add('active');
      document.getElementById('formSection').style.display = 'block';
      document.getElementById('linkSection').style.display = 'none';
      document.getElementById('candidateName').value = '';
      document.getElementById('candidateEmail').value = '';
      document.getElementById('candidatePhone').value = '';
    }

    function closeSendModal() {
      document.getElementById('sendModal').classList.remove('active');
      currentCandidateData = null;
    }

    function closeCandidatesModal() {
      document.getElementById('candidatesModal').classList.remove('active');
    }

    // ===== Phase 3: Candidate Results =====

    function showCandidatesModal(jobId, jobTitle) {
      currentJobId = jobId;
      const modal = document.getElementById('candidatesModal');
      const container = document.getElementById('candidatesList');
      container.innerHTML = '<div class="summary-loading">Đang tải danh sách ứng viên...</div>';
      modal.classList.add('active');

      fetch(`/api/job-library/jobs/${jobId}`)
        .then(r => r.json())
        .then(data => {
          const candidates = data.candidates || [];
          if (candidates.length === 0) {
            container.innerHTML = '<div class="summary-empty">Chưa có ứng viên nào. Bấm "Tạo Ứng Viên" để thêm.</div>';
            return;
          }
          container.innerHTML = candidates.map(c => renderCandidateCard(c, jobId, jobTitle)).join('');
        })
        .catch(() => {
          container.innerHTML = '<div class="summary-empty">Lỗi tải danh sách. Vui lòng thử lại.</div>';
        });
    }

    function renderCandidateCard(candidate, jobId, jobTitle) {
      const isCompleted = candidate.interview_status === 'completed';
      const badgeClass = isCompleted ? 'badge-completed' : 'badge-pending';
      const badgeText = isCompleted ? 'Đã hoàn thành' : 'Chưa hoàn thành';
      const timeAgo = getTimeAgo(candidate.created_at);

      let actionsHtml = `<button class="btn btn-copy btn-small" onclick="copyTestLink('${candidate.id}', '${jobId}', this)">Copy link test</button>`;

      if (!isCompleted) {
        actionsHtml += `
          <span class="candidate-meta">${escapeHtml(timeAgo)}</span>
          <button class="btn btn-remind btn-small" onclick="remindCandidate('${candidate.id}', this)">Nhắc làm bài</button>
        `;
      } else {
        actionsHtml += `
          <button class="btn btn-expand btn-small" onclick="toggleSummary('${candidate.id}', '${jobId}')">Xem tóm tắt</button>
          <button class="btn btn-primary btn-small" onclick="openFullChat('${candidate.id}', '${escapeHtml(candidate.name)}', '${escapeHtml(jobTitle)}')">Xem toàn bộ câu trả lời</button>
          <div class="export-dropdown">
            <button class="btn btn-export btn-small" onclick="toggleExportMenu('pdf-${candidate.id}')">Xuất PDF ▾</button>
            <div id="pdf-${candidate.id}" class="export-menu">
              <button class="export-menu-item" onclick="exportCandidate('${candidate.id}', 'pdf', 'summary')">Tóm tắt</button>
              <button class="export-menu-item" onclick="exportCandidate('${candidate.id}', 'pdf', 'full')">Full chat</button>
            </div>
          </div>
          <div class="export-dropdown">
            <button class="btn btn-export btn-small" onclick="toggleExportMenu('csv-${candidate.id}')">Xuất CSV ▾</button>
            <div id="csv-${candidate.id}" class="export-menu">
              <button class="export-menu-item" onclick="exportCandidate('${candidate.id}', 'csv', 'summary')">Tóm tắt</button>
              <button class="export-menu-item" onclick="exportCandidate('${candidate.id}', 'csv', 'full')">Full chat</button>
            </div>
          </div>
        `;
      }

      return `
        <div class="candidate-card" id="card-${candidate.id}">
          <div class="candidate-header">
            <span class="candidate-name">${escapeHtml(candidate.name)}</span>
            <span class="badge ${badgeClass}">${escapeHtml(badgeText)}</span>
          </div>
          <div class="candidate-actions">${actionsHtml}</div>
          <div id="summary-${candidate.id}" class="summary-accordion"></div>
        </div>
      `;
    }

    function getTimeAgo(dateStr) {
      if (!dateStr) return '';
      const diff = Date.now() - new Date(dateStr).getTime();
      const days = Math.floor(diff / 86400000);
      if (days === 0) return 'Đã gửi hôm nay';
      if (days === 1) return 'Đã gửi hôm qua';
      return `Đã gửi ${days} ngày trước`;
    }

    function copyTestLink(candidateId, jobId, btn) {
      const link = `${window.location.origin}/interview?job=${jobId}&candidate=${candidateId}`;
      navigator.clipboard.writeText(link).then(() => {
        const original = btn.textContent;
        btn.textContent = 'Đã copy ✓';
        btn.disabled = true;
        setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 2000);
      }).catch(() => {
        const textArea = document.createElement('textarea');
        textArea.value = link;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand('copy');
        document.body.removeChild(textArea);
        const original = btn.textContent;
        btn.textContent = 'Đã copy ✓';
        btn.disabled = true;
        setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 2000);
      });
    }

    function remindCandidate(candidateId, btn) {
      btn.textContent = 'Đang gửi...';
      btn.disabled = true;

      fetch(`/api/job-library/candidates/${candidateId}/remind`, { method: 'POST' })
        .then(r => r.json())
        .then(data => {
          btn.textContent = 'Đã gửi ✓';
        })
        .catch(() => {
          btn.textContent = 'Lỗi, thử lại';
          btn.disabled = false;
        });
    }

    function toggleSummary(candidateId, jobId) {
      const el = document.getElementById(`summary-${candidateId}`);
      if (el.classList.contains('open')) {
        el.classList.remove('open');
        return;
      }

      if (el.dataset.loaded) {
        el.classList.add('open');
        return;
      }

      el.innerHTML = '<div class="summary-loading">Đang tải tóm tắt...</div>';
      el.classList.add('open');

      fetch(`/api/job-library/candidates/${candidateId}/results`)
        .then(r => r.json())
        .then(data => {
          if (!data.summaries || data.summaries.length === 0) {
            el.innerHTML = `<div class="summary-section"><div class="summary-empty">Chưa có tóm tắt. Đang xử lý, vui lòng thử lại sau.<br><button class="btn btn-small btn-secondary" onclick="retrySummary('${candidateId}', '${jobId}')">Thử lại</button></div></div>`;
            return;
          }
          el.innerHTML = renderSummaries(data.summaries);
          el.dataset.loaded = 'true';
        })
        .catch(() => {
          el.innerHTML = '<div class="summary-section"><div class="summary-empty">Lỗi tải tóm tắt. Vui lòng thử lại.</div></div>';
        });
    }

    function retrySummary(candidateId, jobId) {
      const el = document.getElementById(`summary-${candidateId}`);
      el.dataset.loaded = '';
      toggleSummary(candidateId, jobId);
    }

    function renderSummaries(summaries) {
      const grouped = {};
      for (const s of summaries) {
        if (!grouped[s.skill_name]) grouped[s.skill_name] = [];
        grouped[s.skill_name].push(s);
      }

      let html = '<div class="summary-section">';
      for (const [skill, items] of Object.entries(grouped)) {
        html += `<div class="skill-group-title">${escapeHtml(skill)}</div>`;
        for (const item of items) {
          html += `<div class="question-item">`;
          html += `<div class="question-text">Q: ${escapeHtml(item.question_text)}</div>`;
          html += `<div class="answer-summary">${escapeHtml(item.main_answer_summary)}</div>`;
          if (item.followup_summary) {
            html += `<div class="followup-summary">Follow-up: ${escapeHtml(item.followup_summary)}</div>`;
          }
          html += `</div>`;
        }
      }
      html += '</div>';
      return html;
    }

    function openFullChat(candidateId, candidateName, jobTitle) {
      const modal = document.getElementById('chatModal');
      const title = document.getElementById('chatModalTitle');
      const container = document.getElementById('chatMessagesContainer');

      title.textContent = `${candidateName} — ${jobTitle}`;
      container.innerHTML = '<div class="summary-loading">Đang tải...</div>';
      modal.classList.add('active');

      fetch(`/api/job-library/candidates/${candidateId}/results`)
        .then(r => r.json())
        .then(data => {
          if (!data.messages || data.messages.length === 0) {
            container.innerHTML = '<div class="summary-empty">Chưa có tin nhắn nào.</div>';
            return;
          }
          container.innerHTML = data.messages.map(m =>
            `<div class="chat-bubble ${m.sender === 'ai' ? 'chat-ai' : 'chat-candidate'}">${escapeHtml(m.content)}</div>`
          ).join('');
        })
        .catch(() => {
          container.innerHTML = '<div class="summary-empty">Lỗi tải dữ liệu.</div>';
        });
    }

    function closeChatModal() {
      document.getElementById('chatModal').classList.remove('active');
    }

    function toggleExportMenu(menuId) {
      document.querySelectorAll('.export-menu').forEach(m => {
        if (m.id !== menuId) m.classList.remove('show');
      });
      document.getElementById(menuId).classList.toggle('show');
    }

    function exportCandidate(candidateId, format, content) {
      document.querySelectorAll('.export-menu').forEach(m => m.classList.remove('show'));

      fetch(`/api/job-library/candidates/${candidateId}/export`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ format, content })
      })
        .then(response => {
          if (!response.ok) throw new Error('Export failed');
          return response.blob();
        })
        .then(blob => {
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `export_${candidateId}.${format}`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          window.URL.revokeObjectURL(url);
        })
        .catch(() => {
          alert('Xuất file thất bại, vui lòng thử lại');
        });
    }

    // Close export menus when clicking outside
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.export-dropdown')) {
        document.querySelectorAll('.export-menu').forEach(m => m.classList.remove('show'));
      }
    });

    function generateLink() {
      const name = document.getElementById('candidateName').value;
      const email = document.getElementById('candidateEmail').value;
      const phone = document.getElementById('candidatePhone').value;

      if (!name || !email || !phone) {
        alert('Điền đầy đủ thông tin!');
        return;
      }

      fetch(`/api/job-library/jobs/${currentJobId}/candidates`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, phone })
      })
        .then(r => r.json())
        .then(data => {
          if (data.candidate_id) {
            // Generate interview link by calling the generate-link endpoint
            return fetch(`/api/job-library/candidates/${data.candidate_id}/generate-link`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ jobId: currentJobId })
            }).then(r => r.json()).then(linkData => {
              const interviewLink = linkData.interview_link || `${window.location.origin}/interview?token=${data.candidate_id}`;

              // Store candidate data for email functionality
              currentCandidateData = { name, email, interviewLink };

              // Display link section
              document.getElementById('generatedLink').value = interviewLink;
              document.getElementById('formSection').style.display = 'none';
              document.getElementById('linkSection').style.display = 'flex';
            });
          } else {
            alert('Lỗi: không thể tạo ứng viên');
          }
        })
        .catch(err => {
          alert('Lỗi: ' + err.message);
        });
    }

    function showCreateJobForm() {
      window.location.href = '/index.html';
    }

    function openJobDetail(jobId) {
      currentJobId = jobId;
      fetch(`/api/job-library/jobs/${jobId}`)
        .then(r => r.json())
        .then(data => {
          const { job, candidates } = data;
          const skillsArray = Array.isArray(job.skills) ? job.skills : JSON.parse(job.skills || '[]');
          const questionsBySkill = typeof job.questions_by_skill === 'string'
            ? JSON.parse(job.questions_by_skill || '{}')
            : job.questions_by_skill;

          let html = `
            <div style="margin-bottom: 1rem;">
              <h3>${job.job_title}</h3>
              <p><strong>Level:</strong> ${job.level}</p>
              <p><strong>Company:</strong> ${job.company}</p>
              <p><strong>Số ứng viên:</strong> ${candidates.length}</p>
            </div>

            <div style="margin-bottom: 1rem;">
              <h4>Job Description</h4>
              <p style="font-size: 13px; color: #666; max-height: 150px; overflow-y: auto; padding: 8px; background: #f9f9f9; border-radius: 4px;">
                ${job.jd_text}
              </p>
            </div>

            <div style="margin-bottom: 1rem;">
              <h4>Kỹ Năng Yêu Cầu</h4>
              <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                ${skillsArray.map(skill => `<span style="background: #e3f2fd; color: #1976d2; padding: 4px 12px; border-radius: 16px; font-size: 13px;">${skill}</span>`).join('')}
              </div>
            </div>

            <div style="margin-bottom: 1rem;">
              <h4>Các Câu Hỏi</h4>
              ${Object.entries(questionsBySkill).map(([skill, questions]) => `
                <div style="margin-bottom: 12px; padding: 8px; background: #f5f5f5; border-radius: 4px;">
                  <strong style="color: #333;">${skill}</strong>
                  <ul style="margin: 8px 0 0 20px; font-size: 13px;">
                    ${questions.map(q => `<li>${q}</li>`).join('')}
                  </ul>
                </div>
              `).join('')}
            </div>
          `;

          document.getElementById('editJobContent').innerHTML = html;
          document.getElementById('editJobModal').classList.add('active');
        })
        .catch(err => alert('Lỗi khi load job details: ' + err.message));
    }

    function closeEditJobModal() {
      document.getElementById('editJobModal').classList.remove('active');
    }

    function editJobSetup() {
      const jobId = currentJobId;
      if (jobId) {
        window.location.href = `/index.html?edit=${jobId}`;
      }
    }

    // Copy link button handler
    document.addEventListener('click', (e) => {
      if (e.target.classList.contains('copy-link-btn')) {
        const link = document.getElementById('generatedLink').value;
        const originalText = e.target.textContent;

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(link).then(() => {
            e.target.textContent = '✓ Đã Copy';
            e.target.style.background = '#4caf50';
            setTimeout(() => {
              e.target.textContent = originalText;
              e.target.style.background = '';
            }, 2000);
          }).catch(err => {
            // Fallback: use older method
            fallbackCopyToClipboard(link, e.target, originalText);
          });
        } else {
          fallbackCopyToClipboard(link, e.target, originalText);
        }
      }
    });

    // Fallback copy function
    function fallbackCopyToClipboard(text, btn, originalText) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        btn.textContent = '✓ Đã Copy';
        btn.style.background = '#4caf50';
        setTimeout(() => {
          btn.textContent = originalText;
          btn.style.background = '';
        }, 2000);
      } catch (err) {
        alert('Không thể copy link. Vui lòng copy thủ công.');
      }
      document.body.removeChild(textarea);
    }
  </script>
</body>
</html>
