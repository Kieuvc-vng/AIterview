<!DOCTYPE html>
<html>
<head>
  <title>Job Library | AIterview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; }
    header { background: white; padding: 1rem 2rem; border-bottom: 1px solid #eee; }
    .container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
    .job-card { background: white; padding: 1.5rem; margin: 1rem 0; border-radius: 8px; border: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
    .job-info h3 { margin-bottom: 0.5rem; }
    .job-info p { color: #666; font-size: 14px; }
    .actions { display: flex; gap: 0.5rem; }
    button { padding: 0.5rem 1rem; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
    .btn-primary { background: #2196f3; color: white; }
    .btn-secondary { background: #f5f5f5; color: #333; border: 1px solid #ddd; }
    .btn-danger { background: #dc3545; color: white; }
    .btn-info { background: #17a2b8; color: white; }
    .btn-info:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-create { background: #4caf50; color: white; padding: 0.7rem 1.5rem; font-size: 16px; margin-top: 2rem; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal.active { display: flex; }
    .modal-content { background: white; padding: 2rem; border-radius: 8px; max-width: 400px; width: 90%; }
    .modal-content h2 { margin-bottom: 1rem; }
    .modal-content input { width: 100%; padding: 0.7rem; margin-bottom: 1rem; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
    .modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; }
    .link-section { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
    .link-info { color: #4caf50; font-weight: 500; margin: 0; }
    .link-display { display: flex; gap: 10px; }
    .link-input { flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 12px; }
    .btn-small { padding: 6px 12px; font-size: 12px; }
    .send-email-btn { background: #ff9800; color: white; margin-top: 5px; }
  </style>
</head>
<body>
  <header>
    <h1>📚 Thư Viện Job</h1>
  </header>

  <div class="container">
    <div id="jobsList"></div>
    <button class="btn-create" onclick="showCreateJobForm()">+ Tạo Job Mới</button>
  </div>

  <div id="editJobModal" class="modal">
    <div class="modal-content" style="max-width: 600px;">
      <h2>Chi Tiết Job</h2>
      <div id="editJobContent" style="max-height: 500px; overflow-y: auto;">
        <!-- Job details will be populated here -->
      </div>
      <div class="modal-actions" style="margin-top: 1rem;">
        <button class="btn-secondary" onclick="closeEditJobModal()">Đóng</button>
        <button class="btn-primary" id="editJobBtn" onclick="editJobSetup()">Chỉnh Sửa</button>
      </div>
    </div>
  </div>

  <div id="candidatesModal" class="modal">
    <div class="modal-content" style="max-width: 600px; max-height: 600px; overflow-y: auto;">
      <h2>Danh Sách Ứng Viên</h2>
      <div id="candidatesList" style="margin: 1rem 0;"></div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeCandidatesModal()">Đóng</button>
      </div>
    </div>
  </div>

  <div id="sendModal" class="modal">
    <div class="modal-content">
      <h2>Gửi cho Ứng Viên</h2>
      <div id="formSection">
        <input type="text" id="candidateName" placeholder="Tên ứng viên" />
        <input type="email" id="candidateEmail" placeholder="Email" />
        <input type="tel" id="candidatePhone" placeholder="Số điện thoại" />
        <div class="modal-actions">
          <button class="btn-secondary" onclick="closeSendModal()">Hủy</button>
          <button class="btn-primary" onclick="generateLink()">Tạo Link</button>
        </div>
      </div>
      <div id="linkSection" class="link-section" style="display: none;">
        <p class="link-info">✓ Link tạo thành công</p>
        <div class="link-display">
          <input type="text" id="generatedLink" class="link-input" readonly />
          <button class="btn btn-primary btn-small copy-link-btn">Copy</button>
        </div>
        <button class="btn btn-secondary" onclick="closeSendModal()" style="margin-top: 5px;">Đóng</button>
      </div>
    </div>
  </div>

  <div id="deleteConfirmModal" class="modal">
    <div class="modal-content" style="max-width: 400px;">
      <h2>Xóa Job</h2>
      <p id="deleteMessage" style="margin: 1rem 0; color: #333;">Bạn có chắc muốn xóa job này? Tất cả ứng viên sẽ bị xóa theo. <strong>Không thể hoàn tác.</strong></p>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeDeleteConfirm()">Hủy</button>
        <button class="btn-danger" onclick="confirmDelete()">Xóa</button>
      </div>
    </div>
  </div>

  <!-- Review Modal -->
  <div id="reviewModal" class="modal">
    <div class="modal-content" style="max-width: 800px; max-height: 90vh; overflow-y: auto;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h2 style="margin: 0;">Interview Review</h2>
        <button class="btn-secondary" onclick="closeReviewModal()" style="padding: 0.5rem 1rem;">✕ Đóng</button>
      </div>
      <div id="reviewContent">
        <!-- Review content will be populated here -->
      </div>
    </div>
  </div>

  <!-- Edit Evaluation Modal -->
  <div id="editEvaluationModal" class="modal">
    <div class="modal-content" style="max-width: 600px; max-height: 90vh; overflow-y: auto;">
      <h2>Chỉnh Sửa Đánh Giá</h2>
      <div id="editEvaluationContent">
        <!-- Edit form will be populated here -->
      </div>
      <div class="modal-actions" style="margin-top: 1.5rem;">
        <button class="btn-secondary" onclick="closeEditEvaluationModal()">Hủy</button>
        <button class="btn-primary" onclick="saveEditedEvaluations()">Lưu</button>
      </div>
    </div>
  </div>

  <script>
    let currentJobId = null;
    let currentCandidateData = null;

    // Load jobs on page load
    document.addEventListener('DOMContentLoaded', loadJobs);

    function loadJobs() {
      // Get hr_email from localStorage
      const hrEmail = localStorage.getItem('hr_email') || 'default@company.com';

      fetch(`/api/job-library/jobs?hr_email=${encodeURIComponent(hrEmail)}`)
        .then(r => r.json())
        .then(jobs => {
          const list = document.getElementById('jobsList');
          if (jobs.length === 0) {
            list.innerHTML = '<p style="text-align: center; color: #666;">Chưa có job nào. Tạo job mới!</p>';
            return;
          }
          list.innerHTML = jobs.map(job => `
            <div class="job-card">
              <div class="job-info">
                <h3>${job.job_title} (${job.level})</h3>
                <p>${job.company} · ${JSON.parse(job.skills || '[]').length} skills</p>
              </div>
              <div class="actions">
                <button class="btn-primary" onclick="openCandidatesModal('${job.id}')">Xem Ứng Viên</button>
                <button class="btn-secondary" onclick="openSendModal('${job.id}')">Tạo Ứng Viên</button>
                <button class="btn-secondary" onclick="openJobDetail('${job.id}')">Chỉnh Sửa</button>
                <button class="btn-danger" onclick="showDeleteConfirm('${job.id}', '${job.job_title}')">Xóa</button>
              </div>
            </div>
          `).join('');
        });
    }

    function openSendModal(jobId) {
      currentJobId = jobId;
      document.getElementById('sendModal').classList.add('active');
      document.getElementById('formSection').style.display = 'block';
      document.getElementById('linkSection').style.display = 'none';
      document.getElementById('candidateName').value = '';
      document.getElementById('candidateEmail').value = '';
      document.getElementById('candidatePhone').value = '';
    }

    function closeSendModal() {
      document.getElementById('sendModal').classList.remove('active');
      currentCandidateData = null;
    }

    function openCandidatesModal(jobId) {
      currentJobId = jobId;
      document.getElementById('candidatesModal').classList.add('active');
      loadAndDisplayCandidates(jobId);
    }

    function closeCandidatesModal() {
      document.getElementById('candidatesModal').classList.remove('active');
    }

    function formatDate(isoString) {
      if (!isoString) return '—';
      const date = new Date(isoString);
      const day = String(date.getDate()).padStart(2, '0');
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const year = date.getFullYear();
      return `${day}/${month}/${year}`;
    }

    function getStatusBadge(status) {
      const statusMap = {
        'not_started': { text: 'Chưa bắt đầu', color: '#f0f0f0', textColor: '#666' },
        'in_progress': { text: 'Đang phỏng vấn', color: '#fff3cd', textColor: '#856404' },
        'completed': { text: 'Hoàn thành', color: '#d4edda', textColor: '#155724' }
      };
      const statusInfo = statusMap[status] || statusMap['not_started'];
      return `<span style="display: inline-block; padding: 4px 8px; background-color: ${statusInfo.color}; color: ${statusInfo.textColor}; border-radius: 3px; font-size: 12px; font-weight: 500;">${statusInfo.text}</span>`;
    }

    function loadAndDisplayCandidates(jobId) {
      fetch(`/api/job-library/jobs/${jobId}`)
        .then(r => r.json())
        .then(data => {
          const { candidates } = data;
          const listDiv = document.getElementById('candidatesList');

          if (!candidates || candidates.length === 0) {
            listDiv.innerHTML = '<p style="text-align: center; color: #999;">Chưa có ứng viên nào</p>';
            return;
          }

          listDiv.innerHTML = candidates.map(c => {
            const status = c.interview_status || 'not_started';
            const link = c.interview_link ? (
              c.interview_link.startsWith('http://') || c.interview_link.startsWith('https://')
                ? c.interview_link
                : `${window.location.origin}${c.interview_link}`
            ) : 'Chưa tạo link';

            const linkHtml = c.interview_link ? `
              <div style="display: flex; gap: 8px; margin-top: 8px;">
                <input type="text" value="${link}" readonly style="flex: 1; padding: 6px; border: 1px solid #ddd; border-radius: 4px; font-size: 12px;" />
                <button class="btn btn-primary btn-small copy-candidate-link" data-link="${link}">Copy</button>
                <button class="btn btn-danger btn-small delete-candidate-btn" data-candidate-id="${c.id}" data-candidate-name="${c.name}">Xóa</button>
              </div>
            ` : '<p style="color: #ff9800; font-size: 13px;">Link chưa được tạo</p>';

            const statusDetails = `
              <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid #eee; font-size: 12px;">
                <div style="margin-bottom: 8px;">
                  <label for="link-status-${c.id}" style="font-weight: bold;">Trạng thái gửi link:</label>
                  <select id="link-status-${c.id}" class="link-status-select" data-candidate-id="${c.id}" style="margin-left: 8px; padding: 4px 8px; border: 1px solid #ddd; border-radius: 4px; cursor: pointer;">
                    <option value="0" ${!c.link_sent ? 'selected' : ''}>Chưa gửi</option>
                    <option value="1" ${c.link_sent ? 'selected' : ''}>Đã gửi</option>
                  </select>
                  ${c.link_sent_at ? ` • <span style="color: #666;">${formatDate(c.link_sent_at)}</span>` : ''}
                </div>
                <div style="display: flex; gap: 8px; margin-top: 12px;">
                  <button class="btn btn-info btn-small view-results-btn" data-candidate-id="${c.id}" aria-label="Xem kết quả phỏng vấn" ${status !== 'completed' ? 'disabled' : ''}>Xem kết quả</button>
                </div>
              </div>
            `;

            return `
              <div style="padding: 12px; border: 1px solid #eee; border-radius: 4px; margin-bottom: 12px;">
                <div style="display: flex; justify-content: space-between; align-items: start;">
                  <div style="flex: 1;">
                    <h4 style="margin: 0 0 4px 0;">${c.name} ${status === 'completed' ? '<span style="color: #4caf50; font-weight: bold;">✅ Đã hoàn thành</span>' : '<span style="color: #ff9800; font-weight: bold;">⏳ Chờ phỏng vấn</span>'}</h4>
                    <p style="margin: 0; color: #666; font-size: 13px;">${c.email} • ${c.phone}</p>
                  </div>
                </div>
                ${linkHtml}
                ${statusDetails}
              </div>
            `;
          }).join('');

          // Add copy button handlers
          document.querySelectorAll('.copy-candidate-link').forEach(btn => {
            btn.addEventListener('click', (e) => {
              const link = e.target.dataset.link;
              navigator.clipboard.writeText(link).then(() => {
                e.target.textContent = '✓ Đã Copy';
                e.target.style.background = '#4caf50';
                setTimeout(() => {
                  e.target.textContent = 'Copy';
                  e.target.style.background = '';
                }, 2000);
              }).catch(() => {
                alert('Không thể copy link');
              });
            });
          });

          // Add delete button handlers
          document.querySelectorAll('.delete-candidate-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
              const candidateId = e.target.dataset.candidateId;
              const candidateName = e.target.dataset.candidateName;

              if (confirm(`Bạn có chắc muốn xóa ứng viên "${candidateName}"? Không thể hoàn tác.`)) {
                fetch(`/api/job-library/candidates/${candidateId}`, { method: 'DELETE' })
                  .then(r => {
                    if (!r.ok) throw new Error('Xóa không thành công');
                    // Remove from UI
                    e.target.closest('[style*="padding: 12px"]').remove();
                  })
                  .catch(err => alert('Lỗi: ' + err.message));
              }
            });
          });

          // Add status dropdown handlers
          document.querySelectorAll('.link-status-select').forEach(select => {
            select.addEventListener('change', async (e) => {
              const candidateId = e.target.dataset.candidateId;
              const linkSent = parseInt(e.target.value);
              const originalValue = e.target.value; // Store original for proper revert

              // Validate inputs
              if (!candidateId || isNaN(linkSent)) {
                alert('Lỗi: dữ liệu không hợp lệ');
                e.target.value = originalValue; // Revert on validation error
                return;
              }

              e.target.disabled = true; // Disable while loading

              try {
                const response = await fetch(`/candidates/${candidateId}/update-status`, {
                  method: 'PUT',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ link_sent: linkSent })
                });

                if (!response.ok) throw new Error('Failed to update status');
                await response.json(); // Consume response but don't require it

                // Visual feedback
                e.target.style.borderColor = '#4caf50';
                setTimeout(() => {
                  e.target.style.borderColor = '#ddd';
                }, 1500);
              } catch (err) {
                // Revert to original value on error
                e.target.value = originalValue;
                alert('Lỗi: ' + err.message);
              } finally {
                e.target.disabled = false; // Re-enable dropdown
              }
            });
          });

          // Add view-results button handlers
          document.querySelectorAll('.view-results-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
              const candidateId = e.target.dataset.candidateId;
              if (e.target.disabled) return;

              try {
                console.log('Fetching results for candidate:', candidateId);
                // Fetch interview results
                const response = await fetch(`/api/interview/results/${candidateId}`);
                console.log('Response status:', response.status);
                if (!response.ok) {
                  const errorText = await response.text();
                  console.error('API Error:', errorText);
                  throw new Error(`Không tìm thấy kết quả phỏng vấn (${response.status})`);
                }

                const data = await response.json();
                console.log('Results data:', data);
                console.log('evaluation type:', typeof data.evaluation);
                console.log('evaluation value:', data.evaluation);
                const interviewId = data.interviewId;
                const info = data.interview_info;
                // Handle both old { summaries: [] } and new [] response formats
                const evaluationArray = Array.isArray(data.evaluation) ? data.evaluation : (data.evaluation?.summaries || []);
                console.log('evaluationArray:', evaluationArray);
                const transcript = data.transcript || [];

                // Build evaluation HTML by skill (group by skill_name)
                const skillsMap = {};
                evaluationArray.forEach(e => {
                  if (!skillsMap[e.skill_name]) {
                    skillsMap[e.skill_name] = { skill_name: e.skill_name, summary: '' };
                  }
                  if (e.main_answer_summary) {
                    skillsMap[e.skill_name].summary = e.main_answer_summary;
                  }
                });
                const uniqueEvaluations = Object.values(skillsMap);

                const evaluationHtml = uniqueEvaluations.length > 0
                  ? uniqueEvaluations.map(e => `
                    <div style="margin-bottom: 1.5rem; padding: 1rem; background: #f9f9f9; border-radius: 4px;">
                      <h4 style="margin: 0 0 0.5rem 0; color: #2196f3;">${e.skill_name}</h4>
                      <p style="margin: 0; color: #666;"><strong>Đánh giá:</strong> ${e.summary || 'Chưa có'}</p>
                    </div>
                  `).join('')
                  : '<p style="color: #999;">Chưa có đánh giá</p>';

                // Build transcript HTML
                const transcriptHtml = transcript.length > 0
                  ? transcript.map(msg => `
                    <div style="margin-bottom: 1rem; padding: 0.8rem; background: ${msg.sender === 'candidate' ? '#e3f2fd' : '#fff3e0'}; border-radius: 4px;">
                      <p style="margin: 0 0 0.3rem 0; font-weight: bold; color: ${msg.sender === 'candidate' ? '#1976d2' : '#f57c00'};">${msg.sender === 'candidate' ? 'Ứng viên' : 'AI Interviewer'}</p>
                      <p style="margin: 0; color: #333;">${msg.content}</p>
                    </div>
                  `).join('')
                  : '<p style="color: #999;">Chưa có hội thoại</p>';

                // Generate review HTML and show in modal
                const reviewHTML = `
                  <div style="padding: 1rem; background: #f9f9f9; border-radius: 4px; margin-bottom: 1.5rem;">
                    <p style="color: #4caf50; margin: 0; font-weight: bold;">✓ Phỏng vấn đã hoàn thành</p>
                  </div>

                  <div style="margin-bottom: 2rem;">
                    <h3 style="border-bottom: 2px solid #2196f3; padding-bottom: 0.5rem;">Interview Information</h3>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; padding: 1rem; background: #f9f9f9; border-radius: 4px;">
                      <div>
                        <p style="color: #666; margin: 0; font-size: 12px;">Ứng viên:</p>
                        <p style="margin: 0; font-weight: bold;">${info.candidate_name || 'N/A'}</p>
                      </div>
                      <div>
                        <p style="color: #666; margin: 0; font-size: 12px;">Vị trí:</p>
                        <p style="margin: 0; font-weight: bold;">${info.job_title || 'N/A'}</p>
                      </div>
                      <div>
                        <p style="color: #666; margin: 0; font-size: 12px;">Level:</p>
                        <p style="margin: 0; font-weight: bold;">${info.level || 'N/A'}</p>
                      </div>
                      <div>
                        <p style="color: #666; margin: 0; font-size: 12px;">Công ty:</p>
                        <p style="margin: 0; font-weight: bold;">${info.company || 'N/A'}</p>
                      </div>
                    </div>
                  </div>

                  <div style="margin-bottom: 2rem;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                      <h3 style="border-bottom: 2px solid #ff9800; padding-bottom: 0.5rem; flex: 1; margin: 0;">Evaluation Rubric</h3>
                      <button class="btn btn-secondary btn-small" onclick="openEditEvaluationModal('${interviewId}', ${JSON.stringify(data.skills || []).replace(/"/g, '&quot;')}, ${JSON.stringify(uniqueEvaluations).replace(/"/g, '&quot;')})">Edit</button>
                    </div>
                    ${evaluationHtml}
                  </div>

                  <div>
                    <h3 style="border-bottom: 2px solid #9c27b0; padding-bottom: 0.5rem;">Interview Transcript</h3>
                    <div style="max-height: 400px; overflow-y: auto;">
                      ${transcriptHtml}
                    </div>
                  </div>
                `;

                showReviewModal(reviewHTML);
              } catch (err) {
                alert('Lỗi: ' + err.message);
              }
            });
          });
        })
        .catch(err => {
          document.getElementById('candidatesList').innerHTML = '<p style="color: red;">Lỗi: ' + err.message + '</p>';
        });
    }

    function generateLink() {
      const name = document.getElementById('candidateName').value;
      const email = document.getElementById('candidateEmail').value;
      const phone = document.getElementById('candidatePhone').value;

      if (!name || !email || !phone) {
        alert('Điền đầy đủ thông tin!');
        return;
      }

      fetch(`/api/job-library/jobs/${currentJobId}/candidates`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, phone })
      })
        .then(r => r.json())
        .then(data => {
          if (data.candidate_id) {
            // Generate interview link by calling the generate-link endpoint
            return fetch(`/api/job-library/candidates/${data.candidate_id}/generate-link`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ jobId: currentJobId })
            }).then(r => r.json()).then(linkData => {
              const interviewLink = linkData.interview_link || `${window.location.origin}/interview?token=${data.candidate_id}`;

              // Store candidate data for email functionality
              currentCandidateData = { name, email, interviewLink };

              // Display link section
              document.getElementById('generatedLink').value = interviewLink;
              document.getElementById('formSection').style.display = 'none';
              document.getElementById('linkSection').style.display = 'flex';
            });
          } else {
            alert('Lỗi: không thể tạo ứng viên');
          }
        })
        .catch(err => {
          alert('Lỗi: ' + err.message);
        });
    }

    function showCreateJobForm() {
      window.location.href = '/index.html';
    }

    function openJobDetail(jobId) {
      currentJobId = jobId;
      fetch(`/api/job-library/jobs/${jobId}`)
        .then(r => r.json())
        .then(data => {
          const { job, candidates } = data;
          const skillsArray = Array.isArray(job.skills) ? job.skills : JSON.parse(job.skills || '[]');
          const questionsBySkill = typeof job.questions_by_skill === 'string'
            ? JSON.parse(job.questions_by_skill || '{}')
            : job.questions_by_skill;

          let html = `
            <div style="margin-bottom: 1rem;">
              <h3>${job.job_title}</h3>
              <p><strong>Level:</strong> ${job.level}</p>
              <p><strong>Company:</strong> ${job.company}</p>
              <p><strong>Số ứng viên:</strong> ${candidates.length}</p>
            </div>

            <div style="margin-bottom: 1rem;">
              <h4>Job Description</h4>
              <p style="font-size: 13px; color: #666; max-height: 150px; overflow-y: auto; padding: 8px; background: #f9f9f9; border-radius: 4px;">
                ${job.jd_text}
              </p>
            </div>

            <div style="margin-bottom: 1rem;">
              <h4>Kỹ Năng Yêu Cầu</h4>
              <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                ${skillsArray.map(skill => `<span style="background: #e3f2fd; color: #1976d2; padding: 4px 12px; border-radius: 16px; font-size: 13px;">${skill}</span>`).join('')}
              </div>
            </div>

            <div style="margin-bottom: 1rem;">
              <h4>Các Câu Hỏi</h4>
              ${Object.entries(questionsBySkill).map(([skill, questions]) => `
                <div style="margin-bottom: 12px; padding: 8px; background: #f5f5f5; border-radius: 4px;">
                  <strong style="color: #333;">${skill}</strong>
                  <ul style="margin: 8px 0 0 20px; font-size: 13px;">
                    ${questions.map(q => `<li>${q}</li>`).join('')}
                  </ul>
                </div>
              `).join('')}
            </div>
          `;

          document.getElementById('editJobContent').innerHTML = html;
          document.getElementById('editJobModal').classList.add('active');
        })
        .catch(err => alert('Lỗi khi load job details: ' + err.message));
    }

    function closeEditJobModal() {
      document.getElementById('editJobModal').classList.remove('active');
    }

    function editJobSetup() {
      const jobId = currentJobId;
      if (jobId) {
        window.location.href = `/index.html?edit=${jobId}`;
      }
    }

    // Copy link button handler
    document.addEventListener('click', (e) => {
      if (e.target.classList.contains('copy-link-btn')) {
        const link = document.getElementById('generatedLink').value;
        const originalText = e.target.textContent;

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(link).then(() => {
            e.target.textContent = '✓ Đã Copy';
            e.target.style.background = '#4caf50';
            setTimeout(() => {
              e.target.textContent = originalText;
              e.target.style.background = '';
            }, 2000);
          }).catch(err => {
            // Fallback: use older method
            fallbackCopyToClipboard(link, e.target, originalText);
          });
        } else {
          fallbackCopyToClipboard(link, e.target, originalText);
        }
      }
    });

    // Fallback copy function
    function fallbackCopyToClipboard(text, btn, originalText) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        btn.textContent = '✓ Đã Copy';
        btn.style.background = '#4caf50';
        setTimeout(() => {
          btn.textContent = originalText;
          btn.style.background = '';
        }, 2000);
      } catch (err) {
        alert('Không thể copy link. Vui lòng copy thủ công.');
      }
      document.body.removeChild(textarea);
    }

    // Delete job functions
    let deleteJobContext = { jobId: null, jobTitle: null };

    function showDeleteConfirm(jobId, jobTitle) {
      deleteJobContext = { jobId, jobTitle };
      const modal = document.getElementById('deleteConfirmModal');
      const message = document.getElementById('deleteMessage');
      message.innerHTML = `Bạn có chắc muốn xóa job <strong>"${jobTitle}"</strong>? Tất cả ứng viên sẽ bị xóa theo. <strong>Không thể hoàn tác.</strong>`;
      modal.classList.add('active');
    }

    function closeDeleteConfirm() {
      document.getElementById('deleteConfirmModal').classList.remove('active');
      deleteJobContext = { jobId: null, jobTitle: null };
    }

    function confirmDelete() {
      const { jobId, jobTitle } = deleteJobContext;
      if (!jobId) return;

      fetch(`/api/job-library/jobs/${jobId}`, {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' }
      })
        .then(r => {
          if (!r.ok) throw new Error('Failed to delete job');
          return r.json();
        })
        .then(data => {
          closeDeleteConfirm();
          alert(`✓ Đã xóa job "${jobTitle}" thành công`);
          loadJobs();
        })
        .catch(err => {
          alert('Lỗi khi xóa job: ' + err.message);
        });
    }

    function closeReviewModal() {
      document.getElementById('reviewModal').classList.remove('active');
    }

    function showReviewModal(reviewHTML) {
      document.getElementById('reviewContent').innerHTML = reviewHTML;
      document.getElementById('reviewModal').classList.add('active');
    }

    // Edit evaluation functions
    let currentEditInterviewId = null;
    let currentEditSkills = [];

    function openEditEvaluationModal(interviewId, skills, currentEvaluations) {
      currentEditInterviewId = interviewId;
      currentEditSkills = skills;

      // Create evaluation map for quick lookup
      const evalMap = {};
      currentEvaluations.forEach(e => {
        evalMap[e.skill_name] = e.summary || '';
      });

      // Build form for all skills
      const formHtml = skills.map((skill, idx) => `
        <div style="margin-bottom: 1.5rem; padding: 1rem; border: 1px solid #ddd; border-radius: 4px;">
          <label style="display: block; font-weight: bold; margin-bottom: 0.5rem; color: #2196f3;">${skill}</label>
          <textarea
            id="skill-eval-${idx}"
            data-skill="${skill}"
            placeholder="Nhập đánh giá cho kỹ năng này"
            style="width: 100%; padding: 0.7rem; border: 1px solid #ddd; border-radius: 4px; font-family: inherit; resize: vertical; min-height: 100px;"
          >${evalMap[skill] || ''}</textarea>
        </div>
      `).join('');

      document.getElementById('editEvaluationContent').innerHTML = formHtml || '<p style="color: #999; padding: 1rem;">Không có kỹ năng để đánh giá</p>';
      document.getElementById('editEvaluationModal').classList.add('active');
    }

    function closeEditEvaluationModal() {
      document.getElementById('editEvaluationModal').classList.remove('active');
      currentEditInterviewId = null;
      currentEditSkills = [];
    }

    async function saveEditedEvaluations() {
      if (!currentEditInterviewId) return;

      // Collect all edited evaluations
      const evaluations = {};
      currentEditSkills.forEach((skill, idx) => {
        const textarea = document.getElementById(`skill-eval-${idx}`);
        evaluations[skill] = textarea.value.trim();
      });

      try {
        const response = await fetch(`/api/interview/summaries/${currentEditInterviewId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ evaluations })
        });

        if (!response.ok) {
          const errorText = await response.text();
          console.error('API Error:', errorText);
          throw new Error('Lỗi khi lưu đánh giá');
        }

        const data = await response.json();
        console.log('Evaluations saved:', data);

        // Close modal and reload results
        closeEditEvaluationModal();
        alert('✓ Đã lưu đánh giá thành công');
        closeReviewModal();

        // Reload candidates list to reflect changes
        if (currentJobId) {
          loadAndDisplayCandidates(currentJobId);
        }
      } catch (err) {
        console.error('Error saving evaluations:', err);
        alert('Lỗi: ' + err.message);
      }
    }
  </script>
</body>
</html>
